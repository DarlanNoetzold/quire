<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">📚 Paper Reader</div>
  <nav>
    <button class="aba ativa" data-aba="buscar">Search</button>
    <button class="aba" data-aba="biblioteca">Library</button>
    <button class="aba" data-aba="importar">Import</button>
    <button class="aba" data-aba="config">Settings</button>
  </nav>
</header>

<main>
  <section id="aba-buscar" class="painel ativo">
    <div class="bloco-busca">
      <input id="campo-busca" type="text" placeholder="Keywords, title or author (e.g. machine learning health)..." autocomplete="off">
      <button id="botao-buscar" class="primario">Search</button>
    </div>
    <div class="filtros">
      <select id="filtro-tipo-busca">
        <option value="">Any source type</option>
        <option value="artigo_periodico">Journal article</option>
        <option value="preprint">Preprint</option>
        <option value="revisao">Review</option>
        <option value="capitulo_livro">Book chapter</option>
        <option value="anais_congresso">Conference proceedings</option>
        <option value="tese_dissertacao">Thesis/Dissertation</option>
      </select>
      <input id="ano-min" type="number" placeholder="Min year" min="1900" max="2100" style="width:100px">
      <input id="ano-max" type="number" placeholder="Max year" min="1900" max="2100" style="width:100px">
      <select id="filtro-fonte-busca" multiple title="Ctrl+click to select multiple sources">
        <option value="openalex">OpenAlex</option>
        <option value="arxiv">arXiv</option>
        <option value="pubmed">PubMed</option>
        <option value="crossref">Crossref</option>
        <option value="doaj">DOAJ</option>
        <option value="europepmc">Europe PMC</option>
        <option value="semanticscholar">Semantic Scholar</option>
        <option value="dblp">dblp</option>
        <option value="hal">HAL</option>
        <option value="zenodo">Zenodo</option>
        <option value="openaire">OpenAIRE</option>
      </select>
      <select id="filtro-idioma-busca">
        <option value="">Any language</option>
        <option value="en">English</option>
        <option value="pt">Portuguese</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
      </select>
      <label class="check-inline"><input type="checkbox" id="filtro-oa-busca"> Open access</label>
      <select id="filtro-ord-busca">
        <option value="">Most relevant</option>
        <option value="ano_novo">Newest first</option>
        <option value="ano_velho">Oldest first</option>
        <option value="citacoes">Most cited</option>
        <option value="titulo_az">Title A–Z</option>
      </select>
      <span id="status-busca" class="status-texto"></span>
    </div>
    <div id="resultados-busca" class="lista"></div>
  </section>

  <section id="aba-biblioteca" class="painel">
    <div class="filtros">
      <select id="filtro-categoria"></select>
      <select id="filtro-tipo">
        <option value="">Any source type</option>
        <option value="artigo_periodico">Journal article</option>
        <option value="preprint">Preprint</option>
        <option value="revisao">Review</option>
        <option value="capitulo_livro">Book chapter</option>
        <option value="anais_congresso">Conference proceedings</option>
        <option value="tese_dissertacao">Thesis/Dissertation</option>
      </select>
      <select id="filtro-status">
        <option value="">Any PDF status</option>
        <option value="nao_baixado">Not downloaded</option>
        <option value="baixado">PDF downloaded</option>
        <option value="baixando">Downloading...</option>
        <option value="falha">Download failed</option>
        <option value="nao_disponivel">No open version</option>
      </select>
      <select id="filtro-resumo">
        <option value="">Any summary status</option>
        <option value="sim">Has summary</option>
        <option value="nao">No summary</option>
      </select>
      <select id="filtro-fonte">
        <option value="">Any source</option>
        <option value="openalex">OpenAlex</option>
        <option value="arxiv">arXiv</option>
        <option value="semanticscholar">Semantic Scholar</option>
        <option value="pubmed">PubMed</option>
        <option value="crossref">Crossref</option>
        <option value="doaj">DOAJ</option>
        <option value="europepmc">Europe PMC</option>
        <option value="manual">Manual import</option>
      </select>
      <select id="filtro-acesso">
        <option value="">Open access (any)</option>
        <option value="sim">Open access only</option>
      </select>
      <select id="filtro-leitura">
        <option value="">Any reading status</option>
        <option value="nao_lido">Not read</option>
        <option value="lendo">Reading</option>
        <option value="lido">Read</option>
      </select>
      <select id="filtro-favoritos">
        <option value="">All (favorites included)</option>
        <option value="sim">Favorites only</option>
      </select>
      <select id="filtro-idioma">
        <option value="">Any language</option>
        <option value="en">English</option>
        <option value="pt">Portuguese</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ru">Russian</option>
      </select>
      <input id="filtro-citacoes" type="number" placeholder="Min citations" min="0" style="width:110px">
      <select id="filtro-adicionado">
        <option value="">Added (any time)</option>
        <option value="hoje">Today</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <input id="filtro-autor" type="text" placeholder="Filter by author..." style="width:170px">
      <input id="filtro-ano-min" type="number" placeholder="From year" min="1900" max="2100" style="width:100px">
      <input id="filtro-ano-max" type="number" placeholder="To year" min="1900" max="2100" style="width:100px">
      <input id="filtro-busca-biblioteca" type="text" placeholder="Filter by title/classification...">
      <select id="filtro-ordenacao">
        <option value="recente">Most recently added</option>
        <option value="antigo">Oldest added</option>
        <option value="titulo_az">Title A–Z</option>
        <option value="titulo_za">Title Z–A</option>
        <option value="ano_novo">Newest year</option>
        <option value="ano_velho">Oldest year</option>
        <option value="classificacao">Classification A–Z</option>
        <option value="fonte">Source A–Z</option>
        <option value="citacoes">Most cited</option>
        <option value="favoritos">Favorites first</option>
        <option value="autor">Author A–Z</option>
      </select>
      <button id="limpar-filtros" class="secundario">Clear</button>
    </div>
    <div id="lista-biblioteca" class="lista"></div>
  </section>

  <section id="aba-importar" class="painel">
    <h2>Import PDF manually</h2>
    <p class="ajuda">Use this when no open-access version is available automatically (institutional access, SciELO, etc.). The PDF stays only on your computer.</p>
    <div id="zona-drop" class="drop">
      <p>Drag the PDF here or <span class="link">click to choose</span></p>
      <input type="file" id="arquivo-import" accept="application/pdf" hidden>
      <div id="nome-arquivo" class="arquivo-nome"></div>
    </div>
    <div class="form-grid">
      <input id="imp-titulo" type="text" placeholder="Title (automatic if empty)">
      <input id="imp-autores" type="text" placeholder="Authors (separate with ;)">
      <input id="imp-ano" type="number" placeholder="Year" min="1900" max="2100">
      <input id="imp-classificacao" type="text" placeholder="Classification (e.g. Computer Science)">
      <input id="imp-categoria" type="text" placeholder="Library category (e.g. AI)">
    </div>
    <button id="botao-importar" class="primario">Import PDF</button>
    <span id="status-importar" class="status-texto"></span>
  </section>

  <section id="aba-config" class="painel">
    <h2>Settings</h2>
    <div id="status-ferramentas" class="caixa-status"></div>
    <div class="form-grid">
      <label>Summary provider
        <select id="cfg-provider">
          <option value="ollama">Local Ollama (free, PDFs never leave your PC)</option>
          <option value="abacus">Abacus AI (online, uses credits/own key)</option>
        </select>
      </label>
      <label>Ollama model
        <select id="cfg-ollama-model">
          <option value="qwen2.5:3b">qwen2.5:3b (light, ~2 GB)</option>
          <option value="llama3.2:3b">llama3.2:3b (light, ~2 GB)</option>
          <option value="qwen2.5:7b">qwen2.5:7b (good, ~4.7 GB)</option>
          <option value="llama3.1:8b">llama3.1:8b (good, ~4.7 GB)</option>
        </select>
      </label>
      <label>Ollama URL
        <input id="cfg-ollama-url" type="text" value="http://127.0.0.1:11434">
      </label>
      <label>Abacus API key (for the Abacus provider)
        <input id="cfg-abacus-key" type="password" placeholder="Paste your key (stays only on your PC)">
      </label>
      <label>Abacus API URL
        <input id="cfg-abacus-url" type="text" value="https://routellm.abacus.ai/v1">
      </label>
      <label>Abacus model
        <input id="cfg-abacus-model" type="text" value="route-llm">
      </label>
    </div>
    <button id="salvar-config" class="primario">Save settings</button>
    <span id="status-config" class="status-texto"></span>
  </section>
</main>

<div id="modal-detalhe" class="modal-escuro" hidden>
  <div class="modal">
    <button id="fechar-modal" class="fechar">✕</button>
    <div id="conteudo-detalhe"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
